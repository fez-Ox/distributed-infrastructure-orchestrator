nodes:
  - node_id: lxc1
    hostname: LXC1
    ip: 192.0.2.21
    node_type: lxc
    ansible_user: orchestrator
    ssh_identity_file: ~/.ssh/id_ed25519
    enabled: true
    role: worker

  - node_id: lxc2
    hostname: LXC2
    ip: 192.0.2.22
    node_type: lxc
    ansible_user: orchestrator
    ssh_identity_file: ~/.ssh/id_ed25519
    enabled: true
    role: worker

  - node_id: vm1
    hostname: VM1
    ip: 192.0.2.10
    node_type: vm
    ansible_user: orchestrator
    ssh_identity_file: ~/.ssh/id_ed25519
    enabled: true
    role: orchestrator

  - node_id: vm2
    hostname: VM2
    ip: 192.0.2.11
    node_type: vm
    ansible_user: orchestrator
    ssh_identity_file: ~/.ssh/id_ed25519
    enabled: true
    role: worker
